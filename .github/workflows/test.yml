name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (ESLint, including the unsafe-DOM rule)
        run: npm run lint
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check syntax
        run: for f in *.js; do node --check "$f"; done
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - run: npm test
      - name: Build the store zip
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
